[package]
name = "compat-report"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false
description = "Regenerates docs/COMPATIBILITY.md from the compat tables and hle_compat reports."

# Standalone on purpose: a small build-time tool that must not pull the
