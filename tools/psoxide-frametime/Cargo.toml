[package]
name = "psoxide-frametime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Frame-time pages from a psoxide-gate tick log: one page per route, or a before/after comparison of two runs of the same route."

[dependencies]
