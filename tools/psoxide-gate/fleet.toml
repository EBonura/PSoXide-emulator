# The fleet: every first-party game in the PS1 library, the repo that builds it
# and the journey that proves it works. `psoxide-gate all` walks this list.
#
# Paths starting with `~/` are expanded. `library` is relative to `games_dir`
# and names the disc the player actually launches, so `all` tests what ships.
# Third-party titles are not listed: the emulator's own `validate` manifests
# cover them.
#
# A game without a journey file shows as MISSING in the report. A journey is
# required before a library swap or a main landing (see TESTING.md).

games_dir = "~/Downloads/ps1 games"
repos_dir = "~/Desktop/repos"

[[game]]
name = "oot"
library = "Ocarina of Time (oot-psx)/Ocarina of Time (oot-psx).cue"
repo = "oot-psx"

