[workspace]
resolver = "2"
members = [
    "crates/psx-io",
    "crates/psx-gpu",
    "crates/psx-gte",
    "crates/psx-gte-core",
    "crates/psx-vram",
    "crates/psx-math",
    "crates/psx-spu",
    "crates/psx-telemetry",
]

# The examples are built against the MIPS target via a separate
# nightly toolchain -- keep them out of the main workspace so
# `cargo check` in the default (host) target doesn't try to compile
# bare-metal binaries on the wrong target.
# Trimmed copy: only the crates vendored into the emulator repo are members.
exclude = ["examples"]

[workspace.package]
edition    = "2021"
license    = "GPL-2.0-or-later"
repository = "https://github.com/EBonura/PSoXide"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "warn"
todo = "deny"
too_many_arguments = "allow"

[workspace.dependencies]
psx-hw  = { path = "../crates/psx-hw" }
psx-io  = { path = "crates/psx-io" }
psx-gpu = { path = "crates/psx-gpu" }
psx-gte = { path = "crates/psx-gte" }
psx-gte-core = { path = "crates/psx-gte-core" }
psx-vram = { path = "crates/psx-vram" }
psx-math = { path = "crates/psx-math" }
psx-spu  = { path = "crates/psx-spu" }
