# Google's Rust style guide, same settings as PSoXide's sdk/docs/STYLE.md. Three of these
# options are unstable, which is why rust-toolchain.toml pins a nightly and this file opts in.
unstable_features = true
max_width = 100
hex_literal_case = "Lower"
format_macro_matchers = true
imports_granularity = "Module"

# The SDK crates under crates/ and sdk/ are vendored copies exported from the pinned
# SDK revision (make refresh-sdk). They are formatted upstream; reformatting them here
# would make make check-sdk fail.
ignore = ["crates/psx-hw", "crates/psx-iso", "crates/psx-trace", "crates/psxed-format", "sdk/crates", "sdk/examples"]
