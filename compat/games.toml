# Commercial PS1 discs used to track HLE BIOS compatibility.
#
# Facts only: titles, serials, regions, hashes, and which BIOS functions and
# Psy-Q kernel patch routines each game uses. No disc bytes, images or file
# paths belong here; the compat runner finds the owner's own discs by hash.
#
# disc_sha256      sha256 of the raw data image: the first FILE of a cue
#                  sheet, or a clone-CD .img (decoded, when stored as ECM).
# ecm_sha256       sha256 of the .img.ecm container, for discs stored that
#                  way, so a runner without an ECM decoder can still tell
#                  the disc is present.
# boot_exe_sha256  sha256 of the boot executable named by SYSTEM.CNF, so a
#                  disc is recognised whatever image format it is stored in.
# kernel_functions          runtime calls plus every call site that
#                           tools/kcall_scan.py finds on the disc.
# kernel_functions_runtime  functions called from game code after EXE entry
#                           during the census run under the retail BIOS
#                           (attract mode plus scripted START and CROSS).
# kernel_patches            B(56h)/B(57h) patch routines identified by their
#                           OpenBIOS signature hash.
#
# Source: BIOS usage census of 2026-09-24 (bios_syscall_probe with
# PSOXIDE_CENSUS_OUT, plus tools/kcall_scan.py).

