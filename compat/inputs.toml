# Scripted input per game for hle_compat --inputs: the run length and the
# pad schedule that reaches gameplay. Pulses are mask@frame+frames, frames
# counted from the EXE entry; masks are the pad bits (0008 Start, 4000
# Cross, 2000 Circle, 0010 Up, 0020 Right, 0040 Down, 0080 Left). Games not
# listed use the common schedule: Start at 600, Cross at 750, alternating
# every 150 frames to 3450, for 3600 frames.
#
# Each schedule was found on screen (frames looked at) and then checked in
# a run from boot.

[mgs]
note = "Circle confirms in MGS menus and Cross cancels, so Cross after Start went back to the title. New Game, Normal, the dock intro and the first codec call; Up walks Snake at the end."
frames = 9000
pulses = """
0x0008@600+8,0x4000@750+8,0x0008@900+8,0x4000@1050+8,0x0008@1200+8,
0x2000@1330+8,0x2000@1480+8,0x2000@1630+8,0x2000@1780+8,0x2000@1930+8,
